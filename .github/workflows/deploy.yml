name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to redeploy, for rollbacks
        required: false

# Two deployments racing each other produce a revision built from whichever
# finished last, which is not necessarily the newer commit.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write   # required for the OIDC token
  contents: read

env:
  IMAGE_REPOSITORY: wordsearch-api
  APP_IDENTITY_NAME: id-wordsearch-app
  KEY_VAULT_NAME: kv-wordsearch-prod

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ACR Tasks builds server side, so the runner needs neither Docker
      # credentials nor a registry password. The tag is the commit sha:
      # every image is traceable to one commit and nothing is mutable.
      - name: Build image in ACR
        if: inputs.image_tag == ''
        run: |
          az acr build \
            --registry "${{ vars.AZURE_REGISTRY_NAME }}" \
            --image "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --file Dockerfile \
            .

      - name: Resolve image reference
        id: image
        run: |
          TAG="${{ inputs.image_tag }}"
          TAG="${TAG:-$GITHUB_SHA}"
          SERVER=$(az acr show \
            --name "${{ vars.AZURE_REGISTRY_NAME }}" \
            --query loginServer -o tsv)
          echo "reference=${SERVER}/${IMAGE_REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # Add required reviewers to this environment in GitHub to gate production.
    environment:
      name: production
      url: https://${{ steps.deploy.outputs.fqdn }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read bootstrap outputs
        id: context
        run: |
          IDENTITY=$(az identity show \
            --name "$APP_IDENTITY_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query '{id:id,clientId:clientId}' -o json)
          echo "identity_id=$(echo "$IDENTITY" | jq -r .id)" >> "$GITHUB_OUTPUT"
          echo "identity_client_id=$(echo "$IDENTITY" | jq -r .clientId)" >> "$GITHUB_OUTPUT"
          echo "registry_server=$(az acr show \
            --name '${{ vars.AZURE_REGISTRY_NAME }}' \
            --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      # The whole template is redeployed every time, so any manual change
      # made in the portal is corrected here rather than quietly surviving.
      #
      # Static values live in the parameters file; the ones only the run
      # knows are passed after it. Later --parameters arguments win, which is
      # also how you override anything for a one-off deployment.
      - name: Deploy infrastructure and revision
        id: deploy
        run: |
          OUTPUTS=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "deploy-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" \
            --template-file infra/azuredeploy.json \
            --parameters @infra/azuredeploy.parameters.prod.json \
            --parameters \
              containerImage="${{ needs.build.outputs.image }}" \
              registryServer="${{ steps.context.outputs.registry_server }}" \
              appIdentityResourceId="${{ steps.context.outputs.identity_id }}" \
              appIdentityClientId="${{ steps.context.outputs.identity_client_id }}" \
              keyVaultName="${{ env.KEY_VAULT_NAME }}" \
              azureOpenAIEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
            --query properties.outputs -o json)
          echo "fqdn=$(echo "$OUTPUTS" | jq -r .apiFqdn.value)" >> "$GITHUB_OUTPUT"
          echo "revision=$(echo "$OUTPUTS" | jq -r .latestRevisionName.value)" >> "$GITHUB_OUTPUT"
          echo "app_name=$(echo "$OUTPUTS" | jq -r .containerAppName.value)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="https://${{ steps.deploy.outputs.fqdn }}/healthz"
          for attempt in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${STATUS}"
            sleep 10
          done
          echo "::error::The new revision never became healthy."
          az containerapp revision list \
            --name "${{ steps.deploy.outputs.app_name }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[].{name:name,active:properties.active,created:properties.createdTime}" -o table
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ needs.build.outputs.image }}\` |"
            echo "| Revision | \`${{ steps.deploy.outputs.revision }}\` |"
            echo "| URL | https://${{ steps.deploy.outputs.fqdn }} |"
          } >> "$GITHUB_STEP_SUMMARY"
